# Scala Steward configuration.
# See https://scala-steward.org/docs/configuration.html

scalafmt.runAfterUpgrade = true
commits.message = "[scala-steward] Updated ${artifactName} from ${currentVersion} to ${nextVersion}."

# Bundle all updates into a single PR, refreshed on each run.
pullRequests.grouping = [
  { name = "all", title = "[scala-steward] Dependency updates", filter = [{ group = "*" }] }
]
updatePullRequests = "always"
