name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel in-progress runs when starting a new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-integrity:
    name: Build Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    steps:

      # A pull request's own branch rather than its merge, so that a formatting
      # fix can be committed to it. The personal token lets that commit start
      # CI again, which one made with the job's own token would not.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: sbt

      - name: Install SBT
        uses: sbt/setup-sbt@v1
        with:
          disk-cache: false

      # sbt's disk cache keeps what each task made, such as compiled classes and
      # linked JavaScript, under a hash of its inputs, so whatever is unchanged
      # since the run that saved it is reused rather than made again. Every run
      # saves its own and restores the newest: the pull request's, or else
      # main's. It only ever grows, so it is begun afresh each week.
      - name: Name build cache
        id: cache
        run: echo "prefix=sbt-${{ runner.os }}-$(date -u +%G-W%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sbt
          key: ${{ steps.cache.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.cache.outputs.prefix }}

      # Every sbt command from here on goes to the one server the first starts,
      # so the build is loaded once, however many steps use it.
      - name: Check formatting
        id: format
        continue-on-error: true
        run: sbt --client scalafmtCheckAll

      - name: Fix formatting
        if: steps.format.outcome == 'failure'
        run: sbt --client scalafmtAll

      # A pull request is given the fix as a commit of its own.
      - name: Commit formatting
        if: steps.format.outcome == 'failure' && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[linter] Fixed code style violations with `sbt scalafmtAll`."

      # Main is offered it in a pull request.
      - name: Checkout scalafmt-revolver
        if: steps.format.outcome == 'failure' && github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: SgtSwagrid/scalafmt-revolver
          path: .scalafmt-revolver

      - name: Propose formatting
        if: steps.format.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_DIR: .
          BASE_BRANCH: ${{ github.ref_name }}
          UPDATE_BRANCH: scalafmt
          PR_TITLE: "[scalafmt-revolver] Fixed code style violations with `sbt scalafmtAll`."
          PR_BODY_FILE: .scalafmt-revolver/templates/pull-request-body.md
        run: |
          echo .scalafmt-revolver >> .git/info/exclude
          bash .scalafmt-revolver/scripts/publish.sh

      # The fixed code is built by the run its commit starts, not by this one.
      - name: Stop after fixing
        if: steps.format.outcome == 'failure'
        run: |
          echo "::error::The code was not formatted, so a commit fixing it was made, which CI builds instead."
          exit 1

      # Warnings fail the build, of the tests as much as of the code.
      - name: Build
        run: sbt --client 'set ThisBuild / scalacOptions += "-Werror"; Test/compile'

      # Every test runs: sbt's `test` would skip those it has results for, and
      # takes no account of a change to the resources they read.
      - name: Test
        run: sbt --client testFull

      # A repository that deploys itself says in `deploy/package.sh` how it is
      # packaged. Main is packaged here, from the build just tested, for the
      # Deploy workflow to ship rather than build again.
      - name: Package
        if: github.event_name == 'push' && hashFiles('deploy/package.sh') != ''
        run: bash deploy/package.sh

      - name: Upload package
        if: github.event_name == 'push' && hashFiles('deploy/package.sh') != ''
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist
          retention-days: 1

      - name: Stop sbt
        if: always()
        run: sbt --client shutdown || true

      - name: Save build cache
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/sbt
          key: ${{ steps.cache.outputs.prefix }}${{ github.run_id }}
